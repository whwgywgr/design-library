<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Design Library</title>
  <meta name="description" content="A personal collection of designs — live previews, full source code, design docs and inspiration links." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2318181b'/><rect x='22' y='22' width='26' height='26' rx='6' fill='white'/><rect x='52' y='22' width='26' height='26' rx='6' fill='white' opacity='.45'/><rect x='22' y='52' width='26' height='26' rx='6' fill='white' opacity='.45'/><rect x='52' y='52' width='26' height='26' rx='6' fill='white'/></svg>" />
  <link rel="stylesheet" href="assets/style.css" />
  <link rel="stylesheet" href="assets/lib/highlight-github.min.css" />
</head>
<body>

  <!-- ===== Header ===== -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="#/" class="brand" id="brandLink">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="white" stroke="none"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2" opacity=".45"/><rect x="3" y="13" width="8" height="8" rx="2" opacity=".45"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>
        </span>
        Design Library
        <span class="brand-count" id="brandCount"></span>
      </a>

      <div class="header-spacer"></div>

      <div class="search-box">
        <svg class="icon"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="searchInput" placeholder="Search designs, tags…" autocomplete="off" />
        <kbd>/</kbd>
      </div>

      <button class="btn btn-sm" id="addBtn" title="How to add your designs">
        <svg class="icon"><path d="M12 5v14M5 12h14"/></svg>
        Add design
      </button>
    </div>
  </header>

  <!-- ===== App root ===== -->
  <main id="app"></main>

  <!-- ===== Footer ===== -->
  <footer class="site-footer">
    <div class="container footer-inner">
      <span id="footerStats"></span>
      <span class="fi-dot"></span>
      <a href="#" id="footerGuide">How to add a design</a>
      <span class="fi-dot"></span>
      <span id="footerGenerated"></span>
    </div>
  </footer>

  <!-- ===== Drop hint ===== -->
  <div class="drop-hint" id="dropHint">Drop <b>.html</b>, <b>.css</b>, <b>.js</b> or <b>.md</b> files anywhere to add a design</div>

  <!-- ===== Toast ===== -->
  <div class="toast" id="toast" role="status"></div>

  <script src="assets/lib/marked.min.js"></script>
  <script src="assets/lib/highlight.min.js"></script>
  <script src="designs.js?v=1791744038549"></script>
  <script src="assets/app.js"></script>
</body>
</html>
